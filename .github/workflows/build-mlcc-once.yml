# One-off mlcc build smoke: cold Ruby bootstrap, check-only, upload binary.
# Trigger: Actions ? Build mlcc once ? Run workflow.
name: Build mlcc once

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"
  push:
    branches: [main]
    paths:
      - 'compiler/**'
      - 'lib/mlc/**'
      - '.github/workflows/build-mlcc-once.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      MLC_CXX: ccache clang++
      MLC_JOBS: 4
      CCACHE_MAXSIZE: 500M
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_SLOPPINESS: pch_defines,time_macros
    steps:
      - uses: actions/checkout@v4

      - name: Install C++ toolchain (clang, ccache, mold)
        run: sudo apt-get update && sudo apt-get install -y clang ccache mold libxcb1-dev libcairo2-dev libx11-dev

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.ref_name }}-
            ccache-${{ runner.os }}-

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Build mlcc (cold via Ruby)
        run: |
          /usr/bin/time -f 'build_sec=%e' env MLCC_FORCE_RUBY=1 compiler/build.sh

      - name: Smoke check-only
        run: compiler/out/mlcc --check-only compiler/main.mlc

      - name: Publish nightly mlcc release
        if: github.event_name != 'workflow_dispatch'
        run: |
          gh release delete nightly-mlcc --repo jenya239/mlc --yes --cleanup-tag || true
          gh release create nightly-mlcc compiler/out/mlcc \
            --repo jenya239/mlc \
            --title "Nightly mlcc ($(date -u +%Y-%m-%d))" \
            --notes "Auto-built from $(git rev-parse --short HEAD)" \
            --prerelease
        env:
          GH_TOKEN: ${{ github.token }}

      - name: ccache stats
        run: ccache -s

      - name: Upload mlcc binary
        uses: actions/upload-artifact@v4
        with:
          name: mlcc-linux-x64
          path: compiler/out/mlcc
          retention-days: 7
